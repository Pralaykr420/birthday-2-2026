# Which folders are their own packages.
#   artifacts/omniscient-love  the app she sees
#   artifacts/api-server       the backend
#   lib/db                     the MongoDB models, shared by both
packages:
  - artifacts/*
  - lib/*

# SECURITY: a package version must have been public for at least a day before
# pnpm will install it. Malicious npm releases are usually caught and pulled
# within hours, so this one setting blocks the most common supply-chain
# attack. Do not remove it.
minimumReleaseAge: 1440

# One place for versions used by more than one package, so they can never
# drift apart and cause two copies of React in the same build.
catalog:
  '@types/node': ^22.10.5
  '@types/react': ^19.0.7
  '@types/react-dom': ^19.0.3
  '@vitejs/plugin-react': ^4.3.4
  '@tailwindcss/vite': ^4.0.0
  lucide-react: ^0.469.0
  react: ^19.0.0
  react-dom: ^19.0.0
  tailwindcss: ^4.0.0
  tsx: ^4.19.2
  typescript: ^5.7.3
  vite: ^6.0.7
  zod: ^3.24.1

autoInstallPeers: false
