<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover lets the app draw underneath the notch and the home
      bar on modern phones; the CSS then uses env(safe-area-inset-*) to keep
      content clear of them. Without this the app sits in a letterbox.

      user-scalable is deliberately NOT disabled. Blocking pinch-zoom is a
      common mistake that makes an app unusable for anyone who needs to zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>A little universe</title>
    <meta name="description" content="Something made for one person." />

    <!-- Tints the phone's status bar to match the app. -->
    <meta name="theme-color" content="#17101e" />

    <!-- Makes it behave like a real app once added to an iPhone home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />

    <!--
      Keep it out of Google. This is a private gift, not a website, and it
      has her photographs in it.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Start fetching the fonts before the CSS is even parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
